<title>외주 물류 시스템 내재화 (자체 TMS/WMS·MES·전자계약) | 황병준 포트폴리오</title>
<meta name="description" content="식품·축산 그룹 계열사에서 외주 솔루션으로 운영되던 운송·창고 관리 시스템(TMS/WMS)을 Spring Boot·TreeGrid·Oracle로 직접 구축했습니다. 유지보수는 SAP RFC 연동 개선만 SI 협력사(외주 40%)에 맡기고 애플리케이션 유지보수는 제가 직접(60%) 하는 체계로 바꿔 연간 4,800만원을 줄였습니다. 같은 기간 육가공 사업부 MES(작업 지시·실적 등 전 과정)와 전자계약도 시스템별로 따로 자체 개발했고, 전자계약은 외주 구축비 3,000만원을 자체 API 개발로 대신했습니다. 퇴사(2024.04) 시점에 TMS/WMS·MES·전자계약 모두 운영 중이었고, 입출고·배차·재고 흐름을 직접 구조화한 경험은 이후 LOGION 설계의 바탕이 됐습니다.">
