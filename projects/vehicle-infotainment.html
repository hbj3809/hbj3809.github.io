<title>국내 완성차 브랜드 차량 인포테인먼트 애플리케이션 개발 | 황병준 포트폴리오</title>
<meta name="description" content="국내 완성차 브랜드의 차량용 디스플레이 오디오 2세대 플랫폼에 들어가는 인포테인먼트 애플리케이션을 C++·Qt/QML로 개발했습니다. 기존에 만들어진 개발자 모드를 고도화했고, 이 기능은 당시 신차부터 이후 출시된 전 차종에 탑재돼 디자인 리뉴얼 뒤에도 현행 플랫폼까지 유지되고 있습니다. 인도향 기도 방향(키블라) 안내 기능은 직접 개발했습니다. 구면 삼각법 알고리즘을 구현하고 Kalman Filter로 위치 오차를 보정해, 방위각 오차를 360° 대비 1% 미만(약 3.6° 이내)으로 맞췄습니다. 북미향 전 차종의 GPS(NMEA) 데이터 수집·추적 서비스도 직접 개발하고, 미국 현지에서 3개월간 품질 확인·양산 대응을 맡았습니다.">
