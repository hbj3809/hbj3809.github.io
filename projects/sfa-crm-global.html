<title>4개국 SFA/CRM 공통 플랫폼 단독 구축 (식품·축산 그룹 ERP 표준 모델 채택) | 황병준 포트폴리오</title>
<meta name="description" content="SFA는 국내 영업 지원 시스템으로 시작했습니다. 현업 요구를 받으면서 SAP ERP의 자재(MM)·생산(PP)·영업물류(SD)·재무회계(FI) 모듈과 연동하는 영업·고객·주문·정산 공통 플랫폼으로 넓혔습니다. 도메인은 DDD 경계 네 개로 나눴고, 국가마다 다른 언어·시간대·통화는 공통 어댑터 한 곳에서 처리했습니다. 이 구조로 베트남·필리핀·인도·미얀마 법인에 배포했습니다. 그룹은 계열사마다 다른 외주사의 CRM을 쓰고 있어 데이터를 모으기 어려웠고, 2024.02에 이 플랫폼을 계열사 공통 ERP 표준 모델로 채택했습니다. 현업 보고 자료를 보면 영업사원 생산성이 30%, 계약 전환율이 15% 올랐습니다. 외주 견적과 비교하면 1억 5,000만원을 아꼈습니다.">
