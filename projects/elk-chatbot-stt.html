<title>그룹웨어 ChatBot · ELK 검색 · Whisper STT 지능형 ARS | 황병준 포트폴리오</title>
<meta name="description" content="2024.12에 직접 구축해 연 그룹웨어 ChatBot(배차 요청·자동배차·회수·담당자 조회)을 2025.02 ~ 05에 ELK 검색과 Whisper STT 기반 전화 ARS로 넓혔습니다. ARS 음성 인식은 현장 방언과 변형어 때문에 40%에 머물렀습니다. Whisper는 그대로 두고, 직원 동의를 받아 모은 실제 통화 데이터로 물류 전용어 사전과 오인식 보정을 키우고 KorpatELECTRA를 파인튜닝하는 Airflow 재학습 파이프라인으로 특정 지역권의 배차 요청·담당자 조회·반납 요청 ARS 업무 기준 80~85%까지 올렸고, 업무·지역별 편차는 아직 남아 있습니다. ChatBot 만족도는 내부 직원 분기 설문에서 87점에서 92점으로 올랐고, 이듬해 같은 분기에도 92점을 유지했습니다.">
